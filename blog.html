--- 
layout: default
title: Blog | stainlesteel
--- 
<main class="container text-center items-center">
        <br><br>
        <h2 class="font-bold text-3xl">The Blog</h2><br>
        <p class="desc">my blog where I might regularly post stuff.</p><br>
        <button class="btn"><i class="fa-solid fa-square-rss" style="color: orange;"></i>  <a href="/feed.xml">RSS Feed</a></button>
        <div class="blog">
        {% for post in site.posts %}
            <div id="card", style="border-radius: 20px;">
              <a class="card-title" href="{{ post.url }}"><h3>{{ post.title }}</h3></a>
              <p>{{ post.description }}</p>
              <p id="details">{{post.date | date: "%B %d %Y"}}, {{post.category }}</p>
           </div>
           {% endfor %}
        </div>
        <br><br><br><br><br>
           
</main>
